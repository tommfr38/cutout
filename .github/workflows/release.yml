name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
            artifact: Cutout-mac-universal.dmg
          - os: windows-latest
            platform: --win
            artifact: Cutout-windows-x64-setup.exe
    runs-on: ${{ matrix.os }}
    env:
      # The interface is bundled as static files; the desktop app serves them
      # from its own root, so there is no asset prefix.
      STATIC_EXPORT: '1'
      # Only the Mac build is signed, and only when the certificate secret is
      # there; Windows has no certificate, so it never looks for one.
      MAC_SIGNING: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12 != '' }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12 != '' }}
      # Also exercise the Smart Brush, which proves its model really is
      # bundled rather than quietly downloaded.
      CUTOUT_SMOKE_SMART: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the interface
        run: |
          npm ci
          npm run build:static

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Fetch the model
        working-directory: desktop
        run: node scripts/fetch-model.mjs

      - name: Refuse to release an unsigned Mac app
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/') && env.MAC_SIGNING != 'true'
        run: |
          echo "::error::MAC_CERT_P12 is not set, so this release would ship an unnotarized Mac app."
          exit 1

      - name: Package
        working-directory: desktop
        env:
          # electron-builder imports these into a temporary keychain and signs
          # the app and the DMG with the hardened runtime.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
        run: npx electron-builder ${{ matrix.platform }} --publish never

      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        working-directory: desktop/release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: 28A8BY4QDB
        run: |
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          xcrun notarytool submit Cutout-mac-universal.dmg "${auth[@]}" --wait --output-format json | tee /tmp/notary.json
          id=$(jq -r .id /tmp/notary.json)
          if [ "$(jq -r .status /tmp/notary.json)" != "Accepted" ]; then
            xcrun notarytool log "$id" "${auth[@]}" || true
            exit 1
          fi
          xcrun stapler staple Cutout-mac-universal.dmg
          xcrun stapler staple mac-universal/Cutout.app
          # Judge the DMG the way a downloaded copy is judged.
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" Cutout-mac-universal.dmg
          spctl -a -vv -t open --context context:primary-signature Cutout-mac-universal.dmg
          spctl -a -vv mac-universal/Cutout.app
          xattr -d com.apple.quarantine Cutout-mac-universal.dmg

      - name: Check the packaged app removes a background (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          curl -sL -o /tmp/smoke.jpg "https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/corgi.jpg"
          CUTOUT_SMOKE_IMAGE=/tmp/smoke.jpg "release/mac-universal/Cutout.app/Contents/MacOS/Cutout" | tee /tmp/smoke.log
          grep -q '"ok":true' /tmp/smoke.log

      - name: Check the packaged app removes a background (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/corgi.jpg" -OutFile "$env:TEMP\smoke.jpg"
          $env:CUTOUT_SMOKE_IMAGE = "$env:TEMP\smoke.jpg"
          $out = & "release\win-unpacked\Cutout.exe" | Out-String
          Write-Host $out
          if ($out -notmatch '"ok":true') { throw "smoke test failed" }

      - name: Install from the .exe and run the installed app offline (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          Start-Process -FilePath "release\Cutout-windows-x64-setup.exe" -ArgumentList "/S","/D=C:\CutoutTest" -Wait
          if (!(Test-Path "C:\CutoutTest\Cutout.exe")) { throw "the installer did not place Cutout.exe" }
          Invoke-WebRequest -Uri "https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/corgi.jpg" -OutFile "$env:TEMP\installed.jpg"
          $env:CUTOUT_SMOKE_IMAGE = "$env:TEMP\installed.jpg"
          # Every request goes to a dead proxy, so this proves the models are
          # bundled rather than fetched.
          $out = & "C:\CutoutTest\Cutout.exe" --proxy-server=127.0.0.1:1 "--proxy-bypass-list=<-loopback>" | Out-String
          Write-Host $out
          $passes = ([regex]::Matches($out, '"ok":true')).Count
          if ($passes -lt 2) { throw "installed app failed offline: only $passes checks passed" }
          Write-Host "installed app passed both checks with no network"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/release/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/${{ matrix.artifact }}
          fail_on_unmatched_files: true
